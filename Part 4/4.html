<style>
    .Subscribe_Button {
        background-color: rgb(204, 0, 0);
        color: white;
        border: none;
        padding-bottom: 10px;
        padding-top: 10px;
        padding-left: 16px;
        padding-right: 16px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 10px;
        transition: opacity 0.15s;
        vertical-align: top;
    }
    .Subscribe_Button:hover {
        opacity: 0.75;
    }
    .Subscribe_Button:active {
        opacity: 0.5;
    }


    .Join_Button {
        background-color: white;
        color: rgb(6, 95, 212);
        border-color: rgb(6, 95, 212);;
        border-style: solid;
        border-width: 1px;
        border-radius: 2px;
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 9px;
        padding-bottom: 9px;
        cursor: pointer;
        margin-right: 10px;
        transition: color 0.15s,
                    background-color 0.15s,
                    opacity 0.15s;
        vertical-align: top;
    }
    .Join_Button:hover {
        color: white;
        background-color: rgb(6, 95, 212);
    }
    .Join_Button:active {
        opacity: 0.75;
    }

    .Tweet_Button {
        background-color: rgb(29, 155, 240);
        color: white;
        border-style: none;
        padding-left: 16px;
        padding-right: 16px;
        padding-top: 7px;
        padding-bottom: 7px;
        border-radius: 18px;
        cursor: pointer;
        font-weight: bold;
        font-size: 15;
        transition: box-shadow 0.15s,
                    opacity 0.15s;
        vertical-align: top;
    }
    .Tweet_Button:hover {
        box-shadow: 5px 5px 10px rgba(0,0,0,0.15);
    }
    .Tweet_Button:active {
        opacity: 0.75;
    }
</style>

<button class="Subscribe_Button">
    SUBSCRIBE
</button>

<button class="Join_Button">
    JOIN
</button>

<button class="Tweet_Button">
    Tweet
</button>
